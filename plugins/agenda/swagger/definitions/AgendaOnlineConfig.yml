type: object
description: |
  Configuração do mini-site público de agendamento (`/agenda/:public_id`).
  Singleton por conta — `show`/`update` operam sempre no único registro.
properties:
  id:
    type: integer
  account_id:
    type: integer
  enabled:
    type: boolean
    description: Master switch do agendamento online.
    example: true
  allow_new_patients:
    type: boolean
    description: |
      Se `false`, apenas pacientes já cadastrados (com Contact existente
      por CPF/telefone/email) podem reservar — booking de paciente novo
      retorna 403.
    example: true
  require_whatsapp_verification:
    type: boolean
    example: false
  require_email_verification:
    type: boolean
    example: false
  min_lead_time_minutes:
    type: integer
    minimum: 0
    description: Antecedência mínima (minutos) para reservar.
    example: 60
  future_limit_days:
    type: integer
    minimum: 1
    description: Janela máxima de futuro (dias). Default 60.
    example: 60
  form_fields:
    type: array
    description: |
      Campos do formulário de paciente no mini-site. `system: true` = campo
      nativo (não pode ser removido, só ter `required` editado).
    items:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, "text-long", email, tel, date, select] }
        required: { type: boolean }
        system: { type: boolean }
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
