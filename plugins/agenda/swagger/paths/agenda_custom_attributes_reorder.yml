patch:
  tags:
    - Atributos Customizados
  summary: Reordenar atributos
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [ids]
          properties:
            ids:
              type: array
              description: Nova ordem completa (índice = `position`).
              items:
                type: integer
              example: [3, 1, 5, 2]
  responses:
    '200':
      description: Reordenação aplicada
    '422':
      description: "`ids` não é array"
