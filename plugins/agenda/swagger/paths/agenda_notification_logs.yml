get:
  tags:
    - Logs de Notificação
  summary: Listar logs de envio
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - name: status
      in: query
      schema:
        type: string
        enum: [sent, failed, skipped]
    - name: rule_id
      in: query
      description: Filtra logs de uma regra específica.
      schema:
        type: integer
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    '200':
      description: Lista paginada de logs (ordem `sent_at DESC`)
      content:
        application/json:
          schema:
            type: object
            properties:
              logs:
                type: array
                items:
                  $ref: '../definitions/AgendaNotificationLog.yml'
              meta:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
