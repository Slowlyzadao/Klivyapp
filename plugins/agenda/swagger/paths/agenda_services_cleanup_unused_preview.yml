get:
  tags:
    - Serviços da Agenda
  summary: Preview de serviços sem uso (pré-cleanup)
  description: |
    Lista os serviços que serão removidos por `POST cleanup_unused`. Considera
    sem uso = ZERO `agenda_events` vivos + ZERO `treatment_items` vivos.
    Inclui tanto serviços ativos quanto arquivados sem vínculos.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
  responses:
    '200':
      description: Lista compacta para confirmação na UI
      content:
        application/json:
          schema:
            type: object
            properties:
              count: { type: integer, example: 7 }
              services:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    color: { type: string }
