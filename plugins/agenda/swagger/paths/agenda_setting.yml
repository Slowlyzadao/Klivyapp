get:
  tags:
    - Configurações da Agenda
  summary: Ler preferências do calendário interno
  description: Singleton. Aplica defaults quando o registro ainda não existe.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
  responses:
    '200':
      description: Preferências
      content:
        application/json:
          schema:
            $ref: '../definitions/AgendaSetting.yml'
patch:
  tags:
    - Configurações da Agenda
  summary: Atualizar preferências do calendário
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [agenda_setting]
          properties:
            agenda_setting:
              type: object
              properties:
                block_outside_working_hours: { type: boolean }
                block_lunch_break: { type: boolean }
                block_past_dates: { type: boolean }
                show_only_working_hours: { type: boolean }
                visible_hours_buffer: { type: integer, minimum: 0, maximum: 6 }
                slot_interval_minutes: { type: integer, enum: [15, 30, 60] }
                week_days:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      label: { type: string }
                      enabled: { type: boolean }
                      start: { type: string }
                      end: { type: string }
                      lunchStart: { type: string }
                      lunchEnd: { type: string }
                exceptions:
                  type: array
                  items:
                    type: object
                    properties:
                      title: { type: string }
                      type: { type: string }
                      icon: { type: string }
                      color: { type: string }
                      start: { type: string, format: date }
                      end: { type: string, format: date }
                holidays:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      date: { type: string, description: "DD/MM" }
                      status: { type: string, enum: [closed, open] }
  responses:
    '200':
      description: Preferências atualizadas
      content:
        application/json:
          schema:
            $ref: '../definitions/AgendaSetting.yml'
    '422':
      description: Erro de validação (`slot_interval_minutes` fora do enum, etc)
