get:
  tags:
    - Busca Global
  summary: Busca unificada (Conversas + Contatos)
  description: |
    Busca híbrida estilo WhatsApp Web — usada pelo ⌘K / atalho global.
    Casa contra `name` (ILIKE) e `phone_number`/`identifier` (variantes
    digit-only com/sem o "9" inicial BR, via `Whatsapp::PhoneSearchVariants`).
    Filtra `conversations` apenas pelas `inbox_id`s que o usuário tem acesso.

    Query com menos de 2 caracteres devolve arrays vazios.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - name: q
      in: query
      required: true
      description: "Texto livre. Mínimo 2 chars; senão devolve `{ conversations: [], contacts: [] }`."
      schema:
        type: string
        minLength: 2
  responses:
    '200':
      description: Resultados
      content:
        application/json:
          schema:
            $ref: '../definitions/UnifiedSearchResults.yml'
