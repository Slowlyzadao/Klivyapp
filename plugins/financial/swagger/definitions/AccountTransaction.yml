type: object
properties:
  id:
    type: integer
  entry_type:
    type: string
    enum: [entrada, saida]
    example: "entrada"
  amount:
    type: number
    format: float
    example: 250.0
  status:
    type: string
    enum: [pendente, parcial, recebido, pago, vencido, cancelado]
    example: "pendente"
  due_date:
    type: string
    format: date
    example: "2024-05-10"
  description:
    type: string
    example: "Pagamento de Consulta - João Silva"
  payment_method:
    type: string
    enum: [pix, cartao_credito, cartao_debito, dinheiro, boleto, transferencia]
  bank_account_id:
    type: integer
  patient_id:
    type: integer
  professional_id:
    type: integer
  notes:
    type: string
  created_at:
    type: string
    format: date-time
