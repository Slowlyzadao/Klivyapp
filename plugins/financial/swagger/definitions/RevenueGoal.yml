type: object
description: |
  Meta de receita por período (mensal/trimestral/anual). Upsert por
  `(period, year, month, quarter)`.
properties:
  id: { type: integer }
  period:
    type: string
    enum: [month, quarter, year]
  year:
    type: integer
    example: 2026
  month:
    type: integer
    minimum: 1
    maximum: 12
    nullable: true
    description: Obrigatório quando `period=month`.
  quarter:
    type: integer
    minimum: 1
    maximum: 4
    nullable: true
    description: Obrigatório quando `period=quarter`.
  amount_cents:
    type: integer
    description: BIGINT centavos.
