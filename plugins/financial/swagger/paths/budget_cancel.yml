post:
  tags:
    - Financeiro · Orçamentos
  summary: Cancelar orçamento (BUG-02)
  description: |
    Preserva o orçamento mas marca como `cancelado`. As parcelas pendentes
    são canceladas automaticamente. Requer GERENTE/ADMIN. Idempotência
    via header `Idempotency-Key`.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/id'
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            reason: { type: string }
  responses:
    '200':
      description: Cancelado
      content:
        application/json:
          schema:
            $ref: '../definitions/Budget.yml'
    '422': { description: "Erro" }
