get:
  tags:
    - Financeiro · Parcelas
  summary: Listar parcelas (Tela A Receber)
  description: |
    Aceita filtro multi-status via array (`?status[]=pendente&status[]=vencido`)
    OU string única (`?status=pendente`). `meta` retorna totais agregados
    para KPIs do topo da tela.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - name: status
      in: query
      description: "String ou array. Ex.: `pendente` ou `status[]=pendente&status[]=vencido`."
      schema:
        oneOf:
          - type: string
          - type: array
            items: { type: string }
    - name: patient_id
      in: query
      schema: { type: integer }
    - name: professional_id
      in: query
      schema: { type: integer }
    - name: payment_method
      in: query
      schema: { type: string }
    - name: from
      in: query
      schema: { type: string, format: date }
    - name: to
      in: query
      schema: { type: string, format: date }
    - name: q
      in: query
      description: Busca pelo nome do paciente (ILIKE).
      schema: { type: string }
    - name: sort
      in: query
      schema: { type: string, default: due_date }
    - name: direction
      in: query
      schema: { type: string, enum: [asc, desc], default: asc }
    - name: page
      in: query
      schema: { type: integer, default: 1 }
    - name: per_page
      in: query
      schema: { type: integer, default: 25, maximum: 100 }
  responses:
    '200':
      description: Lista paginada
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../definitions/Installment.yml'
              meta:
                type: object
                properties:
                  page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
                  total_to_receive_cents: { type: integer, description: "pendente+vencido+parcial em aberto" }
                  total_received_cents: { type: integer }
                  total_overdue_cents: { type: integer }
                  total_count: { type: integer }
