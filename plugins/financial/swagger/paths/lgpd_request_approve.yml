post:
  tags:
    - Financeiro · LGPD
  summary: Aprovar solicitação (status `pending` → `approved`)
  description: Requer ADMIN.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/id'
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            notes: { type: string }
  responses:
    '200':
      description: Aprovada
      content:
        application/json:
          schema:
            $ref: '../definitions/LgpdRequest.yml'
    '422':
      description: Status atual não permite aprovação
