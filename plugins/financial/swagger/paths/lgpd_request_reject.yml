post:
  tags:
    - Financeiro · LGPD
  summary: Rejeitar solicitação
  description: |
    `rejection_reason` é obrigatório (compliance). Requer ADMIN.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/id'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [rejection_reason]
          properties:
            rejection_reason: { type: string }
  responses:
    '200':
      description: Rejeitada
      content:
        application/json:
          schema:
            $ref: '../definitions/LgpdRequest.yml'
    '422':
      description: Motivo obrigatório ou status incorreto
