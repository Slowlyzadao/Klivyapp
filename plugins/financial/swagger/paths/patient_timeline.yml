get:
  tags:
    - Financeiro · Paciente
  summary: Timeline financeira do paciente
  description: |
    Substitui `Patients::TransactionsController#financial_timeline` legacy.
    Cada `entry` é um `Budget` com suas `Installment`s agrupadas. Status
    overall é derivado em runtime considerando pagamentos, estornos,
    vencimentos e cancelamentos.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/patientId'
  responses:
    '200':
      description: Timeline
      content:
        application/json:
          schema:
            $ref: '../definitions/PatientFinancialTimeline.yml'
    '403':
      description: |
        Sem permissão `patients.view_financial` (RBAC Klivy). Admin/super_admin
        têm bypass. Recepção/SDR e roles sem essa key recebem 403 mesmo tendo
        acesso ao módulo financeiro standalone (`financial.*`).
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: forbidden }
              message: { type: string, example: 'Você não tem permissão para ver o financeiro do paciente.' }
