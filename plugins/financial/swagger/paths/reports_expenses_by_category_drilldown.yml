get:
  tags:
    - Financeiro · Relatórios
  summary: Drill-down de despesas por categoria
  description: |
    Lista as despesas individuais da categoria. `category_id=null` (string)
    ou vazio = "Sem categoria". Limit 500.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/categoryId'
    - name: from
      in: query
      schema: { type: string, format: date }
    - name: to
      in: query
      schema: { type: string, format: date }
  responses:
    '200':
      description: Despesas
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../definitions/Expense.yml'
