get:
  tags:
    - Financeiro · Relatórios
  summary: Receitas por procedimento (Hub Relatórios)
  description: |
    Agrega `BudgetItem.description` dentro de orçamentos aprovados/concluídos
    no período (por `approved_at`). Versão tabular completa (sem limit) com
    `rank`, `ticket_avg_cents` e `percent_of_total`. Total agregado em
    `summary.total_cents`. Exige role GERENTE/ADMIN/AUDITOR.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - name: from
      in: query
      schema: { type: string, format: date }
    - name: to
      in: query
      schema: { type: string, format: date }
  responses:
    '200':
      description: Agregação por procedimento (ordenada por total desc)
      content:
        application/json:
          schema:
            type: object
            properties:
              period:
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
              summary:
                type: object
                properties:
                  total_cents: { type: integer }
                  total_quantity: { type: integer }
                  procedures_count: { type: integer }
              items:
                type: array
                items:
                  type: object
                  properties:
                    rank: { type: integer }
                    name: { type: string }
                    qty: { type: integer }
                    total_cents: { type: integer }
                    ticket_avg_cents: { type: integer, nullable: true }
                    percent_of_total: { type: number }
    '403':
      description: Sem permissão (exige GERENTE/ADMIN/AUDITOR)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: forbidden }
              required_roles:
                type: array
                items: { type: string }
