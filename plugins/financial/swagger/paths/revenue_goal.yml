delete:
  tags:
    - Financeiro · Metas de Receita
  summary: Encerrar meta (active=false, mantém histórico)
  description: |
    Não exclui o registro: faz soft-encerramento (`active=false`) para preservar
    histórico e auditoria. Responde 200 com a meta encerrada. Requer papel
    GERENTE ou ADMIN.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/id'
  responses:
    '200':
      description: Meta encerrada (`active=false`)
      content:
        application/json:
          schema:
            $ref: '../definitions/RevenueGoal.yml'
    '403':
      description: Acesso negado (apenas GERENTE/ADMIN)
    '404':
      description: Meta não encontrada
