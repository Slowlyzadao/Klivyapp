get:
  tags:
    - Transações Financeiras
  summary: Listar transações
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - name: entry_type
      in: query
      schema:
        type: string
        enum: [entrada, saida]
    - name: status
      in: query
      schema:
        type: string
    - name: q
      in: query
      description: Busca por descrição ou nome do paciente
      schema:
        type: string
  responses:
    '200':
      description: Lista de transações e métricas
      content:
        application/json:
          schema:
            type: object
            properties:
              transactions:
                type: array
                items:
                  $ref: '../definitions/AccountTransaction.yml'
              meta:
                type: object
                properties:
                  total_amount:
                    type: number
                  total_received:
                    type: number
post:
  tags:
    - Transações Financeiras
  summary: Criar nova transação
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            account_transaction:
              $ref: '../definitions/AccountTransaction.yml'
  responses:
    '201':
      description: Transação criada
