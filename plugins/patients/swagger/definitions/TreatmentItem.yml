type: object
description: |
  Item do plano de tratamento (procedimento planejado). Carrega snapshot
  inline do `agenda_service` quando vinculado (PR #6b) — frontend exibe
  nome corrente sem perder `procedure_name` histórico.
properties:
  id: { type: integer }
  treatment_plan_id: { type: integer }
  procedure_code: { type: string, nullable: true }
  procedure_name: { type: string, nullable: true }
  region: { type: string, nullable: true }
  tooth_number: { type: string, nullable: true }
  sessions_planned: { type: integer, minimum: 0 }
  sessions_done: { type: integer, minimum: 0 }
  remaining_sessions: { type: integer, minimum: 0 }
  completion_percentage: { type: number, format: float, minimum: 0, maximum: 100 }
  unit_price: { type: number, format: float, minimum: 0 }
  total_price: { type: number, format: float, minimum: 0 }
  discount_type:
    type: string
    nullable: true
    enum: [percent, amount]
  discount_value: { type: number, format: float, nullable: true, minimum: 0 }
  gross_subtotal: { type: number, format: float }
  discount_amount: { type: number, format: float }
  net_subtotal: { type: number, format: float }
  priority: { type: string, nullable: true }
  status:
    type: string
    enum: [proposto, aprovado, em_andamento, concluido, cancelado]
  clinical_justification: { type: string, nullable: true }
  notes: { type: string, nullable: true }
  agenda_service_id: { type: integer, nullable: true }
  agenda_service:
    type: object
    nullable: true
    description: Snapshot inline do serviço atual quando vinculado.
    properties:
      id: { type: integer }
      name: { type: string }
      color: { type: string }
      price: { type: number, format: float }
      duration_minutes: { type: integer }
      deleted_at: { type: string, format: date-time, nullable: true }
  created_at: { type: string, format: date-time }
  updated_at: { type: string, format: date-time }
