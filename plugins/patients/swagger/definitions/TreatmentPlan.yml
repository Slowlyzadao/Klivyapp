type: object
description: |
  Plano de tratamento (clínico). Após `approve`, dispara em paralelo:
  - geração de PDF (Prawn) anexado em `pdf`
  - criação de `Financial::Budget` em **rascunho** (v2) — recepção valida e aprova depois.

  Suporta aprovação parcial (`item_ids`) — itens não selecionados ficam
  `proposto` e o plano vai `partially_approved=true`.
properties:
  id: { type: integer }
  patient_id: { type: integer }
  account_id: { type: integer }
  title: { type: string, nullable: true }
  description: { type: string, nullable: true }
  status:
    type: string
    enum: [proposto, aprovado, cancelado, concluido]
  partially_approved: { type: boolean }
  approved_at: { type: string, format: date, nullable: true }
  cancellation_reason: { type: string, nullable: true }
  estimated_duration: { type: string, nullable: true }
  lock_version:
    type: integer
    description: Optimistic locking.
  professional_name: { type: string, nullable: true }
  professional_avatar_url: { type: string, nullable: true }
  approved_by_name: { type: string, nullable: true }
  pdf_url:
    type: string
    nullable: true
    description: URL stable do PDF (rota `pdf` deste plano).
  summary:
    type: object
    properties:
      total_items: { type: integer }
      total_sessions_planned: { type: integer }
      total_sessions_done: { type: integer }
      completion_percentage: { type: number, format: float }
      total_value: { type: number, format: float, description: "BRL" }
  treatment_items:
    type: array
    items:
      $ref: './TreatmentItem.yml'
  created_at: { type: string, format: date-time }
  updated_at: { type: string, format: date-time }
