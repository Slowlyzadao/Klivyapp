get:
  tags:
    - Consentimentos (LGPD)
  summary: Listar consentimentos do paciente
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/patientId'
  responses:
    '200':
      description: Lista de consentimentos ativos (ordem `created_at DESC`)
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../definitions/ConsentRecord.yml'
post:
  tags:
    - Consentimentos (LGPD)
  summary: Criar consentimento (status inicial `pendente`)
  description: |
    Cria com status `pendente`. Audit log + timeline event automáticos.
    Assinatura é feita depois via `POST .../:id/sign` ou link remoto via
    `POST .../:id/send_remote`.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/patientId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [title]
          properties:
            title: { type: string, minLength: 2, maxLength: 255 }
            document_type: { type: string }
            body: { type: string, maxLength: 100000 }
            observations: { type: string, maxLength: 50000 }
            form_template_id: { type: integer }
            expires_after_days: { type: integer, description: "Calcula `expires_at` quando assinado" }
  responses:
    '201':
      description: Criado
      content:
        application/json:
          schema:
            $ref: '../definitions/ConsentRecord.yml'
    '422':
      description: Erro de validação
