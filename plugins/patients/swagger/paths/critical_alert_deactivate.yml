patch:
  tags:
    - Alertas Críticos
  summary: Desativar alerta (sem deletar)
  description: Set `active=false`. Útil para arquivar alertas resolvidos sem perder histórico.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/patientId'
    - $ref: '../common.yml#/components/parameters/id'
  responses:
    '200':
      description: Desativado
      content:
        application/json:
          schema:
            type: object
            properties:
              active: { type: boolean, example: false }
