get:
  tags:
    - Alertas Críticos
  summary: Listar alertas ativos do paciente
  description: Ordenados por severidade.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/patientId'
  responses:
    '200':
      description: Lista
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../definitions/CriticalAlert.yml'
post:
  tags:
    - Alertas Críticos
  summary: Criar alerta
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/patientId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [critical_alert]
          properties:
            critical_alert:
              type: object
              required: [alert_type, severity, title]
              properties:
                alert_type: { type: string }
                severity: { type: string }
                title: { type: string }
                description: { type: string }
                active: { type: boolean, default: true }
  responses:
    '201':
      description: Criado
      content:
        application/json:
          schema:
            $ref: '../definitions/CriticalAlert.yml'
    '422':
      description: Erro de validação
