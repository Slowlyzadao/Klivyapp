get:
  tags:
    - Documentos
  summary: Listar documentos do paciente
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/patientId'
    - name: document_type
      in: query
      schema: { type: string, description: "Ex.: receita, atestado, prescricao" }
    - name: status
      in: query
      schema: { type: string }
    - name: page
      in: query
      schema: { type: integer, default: 1 }
    - name: per_page
      in: query
      schema: { type: integer, default: 20 }
  responses:
    '200':
      description: Lista paginada
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../definitions/Document.yml'
