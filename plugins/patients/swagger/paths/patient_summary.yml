get:
  tags:
    - Pacientes
  summary: Resumo consolidado do prontuário (Summary)
  description: Retorna o payload completo do paciente, incluindo último agendamento, próximo agendamento e alertas críticos.
  parameters:
    - $ref: '../../../agenda/swagger/common.yml#/components/parameters/accountId'
    - $ref: '../../../agenda/swagger/common.yml#/components/parameters/id'
  responses:
    '200':
      description: Resumo do prontuário
      content:
        application/json:
          schema:
            type: object
            properties:
              patient:
                $ref: '../definitions/Patient.yml'
              last_appointment:
                $ref: '../../../agenda/swagger/definitions/AgendaEvent.yml'
              next_appointment:
                $ref: '../../../agenda/swagger/definitions/AgendaEvent.yml'
