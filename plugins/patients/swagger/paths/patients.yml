get:
  tags:
    - Pacientes
  summary: Listar pacientes
  parameters:
    - name: q
      in: query
      description: Busca por nome
      schema:
        type: string
    - name: status
      in: query
      description: Filtro por status
      schema:
        type: string
  responses:
    '200':
      description: Lista de pacientes
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../definitions/Patient.yml'
post:
  tags:
    - Pacientes
  summary: Criar novo paciente
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            patient:
              $ref: '../definitions/Patient.yml'
  responses:
    '201':
      description: Paciente criado
