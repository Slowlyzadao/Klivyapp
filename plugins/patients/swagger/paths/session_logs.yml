get:
  tags:
    - Sessões Clínicas
  summary: Listar registros de sessão
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/patientId'
    - name: page
      in: query
      schema: { type: integer, default: 1 }
    - name: per_page
      in: query
      schema: { type: integer, default: 20 }
  responses:
    '200':
      description: Lista paginada (ordem `performed_at DESC`)
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../definitions/SessionLog.yml'
post:
  tags:
    - Sessões Clínicas
  summary: Registrar nova sessão (`draft`)
  description: |
    Cria via `Patients::SessionLogger`. Após criação, incrementa contador
    em `treatment_item` (job async) e atualiza status do `treatment_plan`.
    `clinical_override_reason` opcional registra audit `clinical_override`
    quando o frontend explicitamente burlou um guard clínico.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/patientId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [session_log]
          properties:
            session_log:
              type: object
              required: [performed_at]
              properties:
                treatment_plan_id: { type: integer }
                treatment_item_id: { type: integer }
                appointment_id: { type: integer }
                form_template_id: { type: integer }
                procedure_name: { type: string }
                performed_at: { type: string, format: date-time }
                duration_minutes: { type: integer, minimum: 1 }
                areas_treated:
                  type: array
                  items:
                    type: object
                    properties:
                      region: { type: string }
                      tooth_number: { type: string }
                      description: { type: string }
                      side: { type: string }
                products_used:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      name: { type: string }
                      quantity: { type: number }
                      unit: { type: string }
                      batch: { type: string }
                      expires_at: { type: string, format: date }
                complications: { type: string }
                result_observed: { type: string }
                post_procedure_guidance: { type: string }
                return_needed: { type: boolean }
                return_in_days: { type: integer, minimum: 1 }
                complaint_of_day: { type: string }
                assessment: { type: string }
                next_consultation_details: { type: string }
                observation: { type: string }
                status: { type: string, enum: [draft, signed], default: draft }
                professional_id: { type: integer }
                lock_version: { type: integer }
                clinical_override_reason:
                  type: string
                  description: Justificativa quando bypassando guard clínico do frontend.
  responses:
    '201':
      description: Sessão criada
      content:
        application/json:
          schema:
            $ref: '../definitions/SessionLog.yml'
    '422':
      description: Erro de validação
