get:
  tags:
    - Itens do Plano
  summary: Listar itens do plano
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/patientId'
    - name: treatment_plan_id
      in: path
      required: true
      schema: { type: integer }
  responses:
    '200':
      description: Lista
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../definitions/TreatmentItem.yml'
post:
  tags:
    - Itens do Plano
  summary: Adicionar item ao plano
  description: |
    Backend nullifica `agenda_service_id` se apontar pra serviço
    inexistente/cross-tenant/soft-deletado (PR #6b). `clinical_override_reason`
    opcional registra audit `clinical_override` quando o operador bypassou
    um guard clínico do frontend.
  parameters:
    - $ref: '../common.yml#/components/parameters/accountId'
    - $ref: '../common.yml#/components/parameters/patientId'
    - name: treatment_plan_id
      in: path
      required: true
      schema: { type: integer }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [treatment_item]
          properties:
            treatment_item:
              type: object
              properties:
                procedure_code: { type: string }
                procedure_name: { type: string }
                region: { type: string }
                tooth_number: { type: string }
                sessions_planned: { type: integer, minimum: 0 }
                unit_price: { type: number, format: float, minimum: 0 }
                total_price: { type: number, format: float, minimum: 0 }
                discount_type: { type: string, enum: [percent, amount] }
                discount_value: { type: number, format: float, minimum: 0 }
                priority: { type: string }
                clinical_justification: { type: string }
                notes: { type: string }
                agenda_service_id: { type: integer, nullable: true }
                clinical_override_reason: { type: string }
  responses:
    '201':
      description: Item criado
      content:
        application/json:
          schema:
            $ref: '../definitions/TreatmentItem.yml'
    '422':
      description: Erro de validação
