tags:
  - Account AgentBots
operationId: create-an-account-agent-bot
summary: Create an Agent Bot
description: |
  Create an agent bot in the account.

  **Authorization** (`AgentBotPolicy#create?`, desde 1.6.1.21 — auditoria A-5):
  `administrator` OR Klivy `settings.agent_bots_manage`. Mesmo padrão pra
  `update`/`delete`/`avatar`/`reset_access_token`. `index`/`show` continuam
  abertos pra qualquer agent (bots aparecem em telas de inbox).
security:
  - userApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/agent_bot_create_update_payload'
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/agent_bot'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
