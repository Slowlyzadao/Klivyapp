tags:
  - Canned Responses
operationId: add-new-canned-response-to-account
summary: Add a New Canned Response
description: |
  Add a new Canned Response to Account.

  **Authorization** (`CannedResponsePolicy#create?`, desde 1.6.1.17):
  - `administrator` OR Klivy `settings.canned_create`.
  - Agents sem essa perm recebem 401 (auditoria A-7 — mutations restritas).
security:
  - userApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/canned_response_create_update_payload'
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          description: 'Newly Created Canned Response'
          $ref: '#/components/schemas/canned_response'
  '403':
    description: Access denied
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
