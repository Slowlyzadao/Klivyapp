tags:
  - Conversations
operationId: update-custom-attributes-of-a-conversation
summary: Update Custom Attributes
description: |
  Updates the custom attributes of a conversation.

  **Limites de sanitização** (desde 1.6.1.24 — auditoria M-1):
  - Máximo de **50 keys** no hash (excedentes são silenciosamente dropadas).
  - Cada valor `string` é **truncado em 10.000 caracteres**.
  - Defesa contra JSONB stuffing (DoS via payload gigante + perf de queries).
security:
  - userApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - custom_attributes
        properties:
          custom_attributes:
            type: object
            description: |
              Custom attributes to be set for the conversation. Hash plano
              de até 50 keys; valores string truncados em 10.000 chars.
              Keys/valores excedentes são silenciosamente dropados.
            example:
              order_id: '12345'
              previous_conversation: '67890'
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: object
          properties:
            custom_attributes:
              type: object
              description: The custom attributes of the conversation
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: Conversation not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
