openapi: '3.0.4'
info:
  title: Klivy Plugins API
  version: 1.0.0
  description: Documentação consolidada dos plugins do Klivy.
servers:
  - url: /
tags:
  # ─── Agenda ──────────────────────────────────────────────────────────────────
  - { name: Agendamentos, description: "CRUD e operações de eventos da agenda interna." }
  - { name: Serviços da Agenda, description: "Catálogo de serviços/procedimentos (com soft-delete e cleanup)." }
  - { name: Categorias da Agenda, description: "Categorias coloridas para classificar eventos." }
  - { name: Atributos Customizados, description: "Definições de campos customizados para AgendaEvent." }
  - { name: Regras de Notificação, description: "Regras automáticas de lembretes/confirmações." }
  - { name: Logs de Notificação, description: "Histórico de envios das regras de notificação." }
  - { name: Configurações da Agenda, description: "Preferências do calendário interno e do mini-site público." }
  - { name: Relatórios da Agenda, description: "KPIs, breakdown por status e previsão de ocupação." }
  - { name: Fila de Espera, description: "Lista de espera por contato." }
  - { name: Agenda Pública, description: "Endpoints sem autenticação do mini-site `/agenda/:public_id`." }
  # ─── Pacientes ───────────────────────────────────────────────────────────────
  - { name: Pacientes, description: "CRUD do prontuário + ações operacionais." }
  - { name: Anamneses, description: "Anamneses clínicas versionadas (com finalização imutável)." }
  - { name: Evoluções Clínicas, description: "ClinicalNote (modelo legado em migração para SessionLog)." }
  - { name: Sessões Clínicas, description: "Registros de procedimentos realizados (com assinatura clínica + paciente)." }
  - { name: Planos de Tratamento, description: "Planos clínicos + aprovação que dispara Budget v2 em rascunho." }
  - { name: Itens do Plano, description: "Procedimentos planejados dentro de cada plano." }
  - { name: Alertas Críticos, description: "Alertas exibidos em destaque no prontuário." }
  - { name: Consentimentos (LGPD), description: "Consentimentos informados com assinatura digital." }
  - { name: Documentos, description: "PDFs gerados/anexados." }
  - { name: Exames e Mídias, description: "Imagens, RX, fotos clínicas — Active Storage assinado." }
  - { name: Pastas de Exames, description: "Organização hierárquica de mídias clínicas." }
  - { name: Agenda do Paciente, description: "Visão dos agendamentos exibida na aba do prontuário." }
  - { name: Recall, description: "Preparação de payload de recall via WhatsApp." }
  - { name: Timeline do Paciente, description: "Feed agregado de eventos clínicos e operacionais." }
  - { name: Audit Logs, description: "Logs de auditoria LGPD por paciente + export do prontuário em PDF." }
  # ─── Financeiro v2 (canon Financial::*) ──────────────────────────────────────
  - { name: "Financeiro · Setup", description: "Wizard de configuração inicial (canon F-04)." }
  - { name: "Financeiro · Categorias DRE", description: "Hierarquia da DRE (Demonstrativo de Resultado)." }
  - { name: "Financeiro · Contas Bancárias", description: "Contas + transferências entre contas." }
  - { name: "Financeiro · Regras de Comissão", description: "Cálculo de comissão por profissional." }
  - { name: "Financeiro · Despesas Recorrentes", description: "Despesas que se repetem (canon §4.4)." }
  - { name: "Financeiro · Metas de Receita", description: "Metas mensais/trimestrais/anuais." }
  - { name: "Financeiro · Gateway", description: "Configuração do gateway (Asaas/manual)." }
  - { name: "Financeiro · Orçamentos", description: "Orçamentos + aprovação (gera installments)." }
  - { name: "Financeiro · Parcelas", description: "Tela A Receber + ações (pay, refund, charge, proof)." }
  - { name: "Financeiro · Recibos", description: "Recibos de pagamento (BUG-01 multi-parcela + refund)." }
  - { name: "Financeiro · Lançamentos", description: "Fluxo de Caixa (manual + automático)." }
  - { name: "Financeiro · Despesas", description: "Tela A Pagar + pay/reverse." }
  - { name: "Financeiro · Caixa", description: "Sessões de caixa + sangria/suprimento." }
  - { name: "Financeiro · Crédito do Paciente", description: "Ledger de saldo a favor do paciente." }
  - { name: "Financeiro · Comissões", description: "Ações sobre lançamentos de comissão (canon F-29)." }
  - { name: "Financeiro · Auditoria", description: "Logs de auditoria financeira + export CSV." }
  - { name: "Financeiro · Backups", description: "Backups do banco (local + R2)." }
  - { name: "Financeiro · LGPD", description: "Solicitações de anonimização de paciente (F-33)." }
  - { name: "Financeiro · Relatórios", description: "DRE, Fluxo, Dashboard, Comissões, ticket médio, etc." }
  - { name: "Financeiro · Relatórios · Charts", description: "Mini-charts e séries temporais do Dashboard v2." }
  - { name: "Financeiro · Paciente", description: "Summary + Timeline financeira do paciente (aba do prontuário)." }
  - { name: "Financeiro · Webhooks", description: "Webhooks de gateway (Asaas)." }
  - { name: "Financeiro · Mensalidades", description: "Mensalidades fixas (Financial::RecurringBilling) — motor recorrente que gera Budget+Installment por período. CRUD + pause/resume/cancel." }
  - { name: "Financeiro · Formas de Pagamento", description: "Meios de pagamento (PaymentMethod) + taxas/MDR versionadas (PaymentMethodFee). settlement_mode controla a baixa automática." }
  - { name: "Financeiro · Precificação", description: "Preço/categoria DRE/comissão por serviço da Agenda (ServicePricing). :id na URL é o agenda_service_id." }
  - { name: "Financeiro · Comissionados", description: "Perfil financeiro/bancário do profissional (AgentProfile, ADMIN-only). :id na URL é o user_id." }
  - { name: "Financeiro · Fechamento", description: "Fechamento contábil append-only por período (PeriodClosure) — bloqueia edição retroativa (423 Locked)." }
  # ─── RBAC ────────────────────────────────────────────────────────────────────
  - { name: "Permissões e Funções", description: "KlivyRole — único sistema de permissões ativo (desde 2026-04-30)." }
  - { name: "Permissões (boot)", description: "Snapshot das permissões do usuário corrente — chamado no boot do app." }
  # ─── Core e Busca ────────────────────────────────────────────────────────────
  - { name: "Busca Global", description: "Busca unificada (⌘K) sobre Conversas + Contatos." }
  # ─── Billing (assinatura Klivy) ──────────────────────────────────────────────
  - { name: "Billing · Onboarding", description: "Cadastro inicial da clínica + integração Asaas + Turnstile." }
  - { name: "Billing · Webhooks", description: "Webhooks da cobrança da assinatura Klivy (Asaas billing)." }
  # ─── Bea (AiAgent — plugin ai_agent) ─────────────────────────────────────────
  - { name: "Bea — Base de Conhecimento", description: "Documentos da Bea (substitui Captain::Document legado, pgvector)." }
  - { name: "Bea — Follow-ups", description: "Regras de follow-up automático configuráveis pela clínica." }
  - { name: "Bea — Notificações Internas", description: "Templates pré-definidos que a Bea dispara no Chat Interno (zero token)." }
  - { name: "Bea — Público", description: "Endpoints sem autenticação — health (uptime checker) + feedback (HMAC token)." }
  # ─── Chat Interno (plugin internal_chat) ─────────────────────────────────────
  - { name: "Chat Interno — Salas", description: "CRUD de salas (direct/group), avatar, archive, mute." }
  - { name: "Chat Interno — Mensagens", description: "CRUD de mensagens aninhadas em sala + favorites, reactions, mark_read." }
  - { name: "Chat Interno — Menções", description: "Lista e contadores de @menções dirigidas ao usuário." }
  - { name: "Chat Interno — Stickers", description: "Stickers default da plataforma + custom da conta." }
  - { name: "Chat Interno — Membros", description: "Gestão de membros da sala (Membership). RBAC por room role (owner/admin); manage_memberships ainda não é enforced." }
  - { name: "Chat Interno — Anexos", description: "Galeria de anexos da sala + download (conversão WebP→JPG/PNG para image/webp)." }

